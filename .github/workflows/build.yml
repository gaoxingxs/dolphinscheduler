# 工作流名称
name: Maven Build

# 触发工作流的事件
on:
  #push:
  #  branches: [ main ] # 当 main 分支有 push 时触发
  #pull_request:
  #  branches: [ main ] # 当有 pull request 指向 main 分支时触发
  # 允许手动触发
  workflow_dispatch:

# 定义一个或多个作业（Job）
jobs:
  build: # 作业 ID
    # 作业运行的环境
    runs-on: ubuntu-latest # 使用最新的 Ubuntu Runner

    # 作业包含的步骤
    steps:
    # 第一步：签出代码
    - name: Checkout code
      uses: actions/checkout@v4 # 使用官方的 checkout action v4

    # 第二步：设置 JDK 8
    - name: Set up JDK 8
      uses: actions/setup-java@v4 # 使用官方的 setup-java action v4
      with:
        java-version: '8'        # 指定 Java 版本为 8
        distribution: 'temurin'  # 指定 JDK 发行版 (Temurin 是 AdoptOpenJDK 的继任者，推荐)
        cache: 'maven'           # 启用 Maven 依赖缓存

    # 第三步：使用 Maven 打包
    - name: Build with Maven
      # 运行 Maven 命令
      # -B: Batch mode，非交互模式，适合 CI 环境
      # package: Maven 的打包阶段
      # --file pom.xml: 显式指定 pom 文件（通常是根目录，可以省略，但写上更明确）
      run: mvn clean install -nsu -Pstaging -Dmaven.test.skip=true -Dmaven.javadoc.skip=true

    # 可选步骤：上传构建产物 (例如 JAR/WAR 文件)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package # 定义产物的名称
        # 指定要上传的文件路径，通常在 target 目录下
        # 根据你的项目实际情况修改路径和文件类型 (*.jar, *.war 等)
        path: dolphinscheduler-dist/target/*-bin.tar.gz
